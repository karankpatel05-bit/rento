name: EAS OTA Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update Branch to target'
        required: true
        default: 'production'
      message:
        description: 'Update Message'
        required: false
        default: 'Manual OTA update trigger'

jobs:
  update:
    name: Publish Over-The-Air (OTA) Update
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Setup EAS and Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🚀 Publish EAS OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BRANCH="${{ github.event.inputs.branch || 'production' }}"
          MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message || 'Automated OTA update' }}"
          eas update --branch "$BRANCH" --message "$MESSAGE" --non-interactive
