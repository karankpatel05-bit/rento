name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview generates APK)'
        required: true
        default: 'preview'

jobs:
  build-apk:
    name: Build Standalone APK via EAS Local
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📝 Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🔗 Auto-link EAS Project ID (if first time)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "Auto-initializing project on Expo using EXPO_TOKEN..."
            npx --yes eas-cli init --force --non-interactive
            npx --yes eas-cli update:configure --non-interactive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Chore: Link EAS Project ID from Expo [skip ci]" || true
            git push origin main || true
          fi

      - name: 🔑 Configure Android Signing Credentials
        run: |
          mkdir -p android/keystores
          KEYSTORE_PATH="android/keystores/release.keystore"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using configured repository Android Keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            KEYSTORE_PWD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PWD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "No custom keystore secret detected. Generating local build keystore..."
            KEYSTORE_PWD="rento_local_keystore_pwd"
            KEY_ALIAS="rento"
            KEY_PWD="rento_local_keystore_pwd"
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PWD" -keypass "$KEY_PWD" \
              -dname "CN=com.landlord.rento,OU=Rento,O=Rento,L=Bangalore,S=KA,C=IN"
          fi

          cat <<EOF > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "$KEYSTORE_PATH",
                "keystorePassword": "$KEYSTORE_PWD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PWD"
              }
            }
          }
          EOF
          echo "credentials.json configured successfully."

      - name: 🛠 Compile Standalone APK (EAS Local Build)
        timeout-minutes: 25
        env:
          EAS_NO_VCS: '1'
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building Android APK locally using profile: $PROFILE"
          if npx --yes eas-cli build --platform android --profile "$PROFILE" --local --output=./rento-release.apk --non-interactive; then
            echo "EAS local build completed successfully!"
          else
            echo "EAS local build exited. Performing direct native compilation fallback..."
            npx expo prebuild --platform android --clean --no-install
            cd android
            ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease -x test
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk ./rento-release.apk
          fi
          echo "APK generated at: $(ls -lh ./rento-release.apk)"

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rento-release-apk
          path: ./rento-release.apk
          retention-days: 30
