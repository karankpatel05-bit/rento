name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview generates APK)'
        required: true
        default: 'preview'

jobs:
  build-apk:
    name: Build Standalone APK via EAS Local
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📝 Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🔗 Auto-link EAS Project ID (if first time)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if grep -q "YOUR-PROJECT-ID" app.json; then
            echo "Auto-initializing project on Expo using EXPO_TOKEN..."
            npx eas init --force --non-interactive
            npx eas update:configure --non-interactive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Chore: Link EAS Project ID from Expo [skip ci]" || true
            git push origin main || true
          fi

      - name: 🔑 Configure Android Signing Credentials
        run: |
          mkdir -p android/keystores
          KEYSTORE_PATH="android/keystores/release.keystore"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using configured repository Android Keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            KEYSTORE_PWD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PWD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "No custom keystore secret detected. Generating local build keystore..."
            KEYSTORE_PWD="rento_local_keystore_pwd"
            KEY_ALIAS="rento"
            KEY_PWD="rento_local_keystore_pwd"
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PWD" -keypass "$KEY_PWD" \
              -dname "CN=com.landlord.rento,OU=Rento,O=Rento,L=Bangalore,S=KA,C=IN"
          fi

          cat <<EOF > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "$KEYSTORE_PATH",
                "keystorePassword": "$KEYSTORE_PWD",
                "keyAlias": "$KEY_ALIAS",
                "keyPassword": "$KEY_PWD"
              }
            }
          }
          EOF
          echo "credentials.json configured successfully."

      - name: 🛠 Compile Standalone APK (EAS Local Build)
        env:
          EAS_NO_VCS: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building Android APK locally using profile: $PROFILE"
          npx eas build --platform android --profile "$PROFILE" --local --output=./rento-release.apk --non-interactive

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rento-release-apk
          path: ./rento-release.apk
          retention-days: 30
