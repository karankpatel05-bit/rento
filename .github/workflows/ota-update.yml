name: EAS OTA Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      message:
        description: 'Update Message'
        required: false
        default: 'Automated OTA update'

jobs:
  ota-update:
    name: Publish Over-The-Air (OTA) Update
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🔗 Auto-link EAS Project ID (if first time)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "Auto-initializing project on Expo using EXPO_TOKEN..."
            npx --yes eas-cli init --force --non-interactive
            npx --yes eas-cli update:configure --non-interactive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Chore: Link EAS Project ID from Expo [skip ci]" || true
            git push origin main || true
          fi

      - name: 🚀 Publish EAS OTA Update to Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MESSAGE="${{ github.event.inputs.message || 'Automated OTA update' }}"
          npx --yes eas-cli update --branch production --message "$MESSAGE" --non-interactive
