name: EAS OTA Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      message:
        description: 'Update Message'
        required: false
        default: 'Automated OTA update'

jobs:
  ota-update:
    name: Publish Over-The-Air (OTA) Update
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck code
        run: npx tsc --noEmit

      - name: 🚀 Publish EAS OTA Update to Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MESSAGE="${{ github.event.inputs.message || 'Automated OTA update' }}"
          eas update --branch production --message "$MESSAGE" --non-interactive
